<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swap-Day Packet</title>
<!-- Rob's step-by-step packet for swapping the 15 rebuilt pages into Squarespace. Not a Squarespace page.
     Built Oct 25, 2026 from content/launch-checklist.md (sections A-D) and the hub's PAGES array. Ticks are saved in this browser (localStorage).
     Open it through the hub (served), so the Copy code buttons can read the files. -->
<style>
:root{--bg:#f9f7f1;--card:#fffdf7;--line:#e4dfcc;--ink:#2c2c2c;--muted:#5f5f58;--olive:#5c6642;--olive-deep:#4a5335;--navy:#3f5a78;--tan:#ddd6b8;--clay:#a8603e;--sel:#eef0e6;--warn:#f6e7dc;--done:#e7ecdf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f1a;--card:#262922;--line:#3a3d33;--ink:#ecebe4;--muted:#b3b1a6;--olive:#a9b585;--olive-deep:#c3cd9f;--navy:#9db6d3;--tan:#5a5640;--clay:#d99573;--sel:#30352a;--warn:#3b2f27;--done:#2c3326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Work Sans",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 6px;font:600 28px/1.15 "Epilogue",system-ui,sans-serif;color:var(--olive)}
h2{margin:36px 0 6px;font:600 20px/1.2 "Epilogue",system-ui,sans-serif;color:var(--navy)}
.lede{margin:0 0 16px;color:var(--muted);max-width:46em}
code{font:13px/1.4 ui-monospace,Consolas,monospace;background:var(--sel);padding:1px 5px;border-radius:5px}
a{color:var(--navy)}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 -16px 8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.prog{flex:1 1 200px;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--olive);transition:width .2s}
.bar small{color:var(--muted)}
.bar button,.btn{font:500 13px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bar button:hover,.btn:hover{border-color:var(--olive)}
.btn--copy{border-color:var(--olive);color:var(--olive-deep)}
.btn.ok{background:var(--olive);border-color:var(--olive);color:#fff}
.note{margin:12px 0;padding:14px 16px;border-radius:12px;background:var(--warn);border:1px solid var(--line)}
.note b{color:var(--clay)}
.note ul{margin:8px 0 0;padding-left:20px}
.phase-intro{margin:0 0 12px;color:var(--muted)}
details.page{margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.page[open]{border-color:var(--olive)}
details.page.complete{background:var(--done)}
summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:14px 16px}
summary::-webkit-details-marker{display:none}
summary .n{font:600 13px/1 system-ui,sans-serif;color:var(--muted);min-width:24px}
summary b{font:600 17px/1.2 "Epilogue",system-ui,sans-serif}
summary .path{font:13px/1.3 ui-monospace,Consolas,monospace;color:var(--muted)}
summary .count{margin-left:auto;font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;background:var(--tan);color:var(--ink)}
.tag--hold{background:var(--clay);color:#fff}
.body{padding:0 16px 16px}
.files{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.files a{font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:13px}
.steps{list-style:none;margin:0;padding:0}
.steps li{margin:0}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.steps label:hover{background:var(--sel)}
.steps input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--olive)}
.steps input:checked+span{color:var(--muted);text-decoration:line-through}
.steps h4{margin:12px 8px 4px;font:600 12px/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.steps .warn span{color:var(--clay);font-weight:500}
.steps input:checked+span{color:var(--muted)}
@media (max-width:600px){summary .count{margin-left:0;flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Swap-day packet</h1>
  <p class="lede">Every step to put the 15 rebuilt pages live, in order. Tick as you go: ticks are saved in this browser. Target: all done before <b>Sun Nov 8</b> (Veterans Day 5K). Use <b>Copy code</b> to grab a file, then paste it into the page's Code block in Squarespace.</p>
  <div class="bar"><div class="prog" aria-hidden="true"><i id="prog"></i></div><small id="progTxt"></small><button id="openAll" type="button">Expand all</button><button id="reset" type="button">Reset ticks</button></div>

  <div id="phases"></div>
</div>

<script>
var SITE='https://www.veteranshealingfarm.org', ADMIN='https://lychee-porcupine-awgb.squarespace.com';
// Shared swap steps (launch checklist B, "Per-page steps").
function swapSteps(slug,copy){return [
  'Verify the copy (logged in): text, photos, buttons, links, and phone view.',
  'Swap slugs (gear → General): rename the original <code>/'+slug+'</code> to <code>/'+slug+'-old</code> first, then rename the copy <code>'+copy+'</code> to <code>/'+slug+'</code>.',
  'On the new live page: gear → SEO → <b>Hide page from search results OFF</b>. Save.',
  'View source of <a href="'+SITE+'/'+slug+'" target="_blank" rel="noopener">'+SITE.replace('https://www.','')+'/'+slug+'</a>, search <code>robots</code>: no NOINDEX.',
  'Old original (<code>/'+slug+'-old</code>): Hide from search ON, move to <b>Not Linked</b>. Don\'t delete it yet.'
];}
function newCopy(name,copy){return [
  'Pages → hover <b>'+name+'</b> → <b>Duplicate</b>. On the duplicate: gear → General → slug <code>'+copy+'</code>; move it to <b>Not Linked</b>; gear → SEO → Hide from search results <b>ON</b>.',
  'On the duplicate, delete the existing blocks and add one <b>Code block</b>.'
];}
var PHASES=[
 {t:'Phase 0: settings, today (about 20 minutes)',intro:'No pasting. These fix what Google sees right now and don\'t depend on any swap.',pages:[
  {id:'settings',name:'Site settings and quick fixes',files:[],steps:[
   ['h','Search visibility'],
   'D1: <b>Our Mission &amp; Farm</b> and <b>Programs</b> (the live originals): gear → SEO → Hide from search results <b>OFF</b>. Check <a href="'+SITE+'/about" target="_blank" rel="noopener">/about</a> and <a href="'+SITE+'/programs" target="_blank" rel="noopener">/programs</a> page source: no NOINDEX.',
   'D4: <b>Board (Copy)</b> <code>/board-1</code>: Hide from search results <b>ON</b>.',
   'D5: <b>Sponsors copy</b> <code>/sponsors-1</code>: Hide from search results <b>ON</b>.',
   ['h','Titles'],
   'D8: gallery <code>/2022-2024-gallery</code> is titled "Gallery 2022 - 2023": make the title and the years agree.',
   'D9: gallery <code>/gallery-2024-present</code> is titled "Gallery 2024": same fix.',
   ['h','Site-wide'],
   'C1: Settings → <b>Crawlers</b>: turn OFF "Block known artificial intelligence crawlers" (leave search engines on). Check <a href="'+SITE+'/robots.txt" target="_blank" rel="noopener">/robots.txt</a>: no GPTBot / ClaudeBot list.',
   'Crisis-line Announcement Bar: follow <a href="site/announcement-bar.md" target="_blank">site/announcement-bar.md</a>.',
   'Custom CSS: paste the current <code>site/custom.less</code> (Design → Custom CSS).'
  ]},
  {id:'preview',name:'Preview mode (browse the new site before the swap)',files:['site/preview-mode.html'],steps:[
   ['h','Set up'],
   'Copy the code (button above). Settings → Advanced → <b>Code Injection</b> → <b>Header</b>: paste it below anything already there. Save.',
   'Ways in (staff only, nothing announced): the faint <b>Site preview</b> link at the very bottom right of the footer; or add <code>?new=1</code> to any address (e.g. <a href="'+SITE+'/volunteer?new=1" target="_blank" rel="noopener">/volunteer?new=1</a>); or open a copy page like /home-1. Tell staff about the footer link.',
   ['h','Test'],
   'Click the footer link on the homepage: <a href="'+SITE+'/home-1" target="_blank" rel="noopener">/home-1</a> opens with a green <b>New site preview · Back to old site</b> badge at bottom left.',
   'Click through the menu and buttons: you stay on copy pages (addresses end in <code>-1</code> or <code>-copy</code>).',
   '<b>Back to old site</b> lands on the same page in the old site, with preview off and the footer link back.',
   'A page with no new version yet (Videos, Galleries…) shows a blue <b>Old site (no new version yet) · Exit preview</b> badge; its links still lead into the new site. New copies are picked up automatically (in a fresh tab).',
   'Forms on copy pages are the real forms: use test entries only. A private window on the plain site shows no badge.'
  ]}
 ]},
 {t:'Phase 1: low-risk pages',intro:'Low traffic, simple pages, so a mistake costs little. Donate and the Privacy Policy go the same day.',pages:[
  {id:'resources',name:'Resources',copy:'/resources-1',slug:'resources',files:['content/resources-full.html'],pre:[],post:['The crisis numbers work on the live page: 988 then press 1, text 838255.']},
  {id:'testimonials',name:'Testimonials',copy:'/testimonials-1',slug:'testimonials',files:['content/testimonials-full.html'],pre:['Paste the full file only. (Don\'t paste <code>testimonials-hero.html</code>: it\'s already inside.)'],post:['"Read Robert\'s full story" opens and closes.']},
  {id:'newsletters',name:'Newsletters',copy:'/newsletters-1',slug:'newsletters',files:['content/newsletters-full.html'],pre:['Copy page already created and pasted, with the native sign-up form below the Code block (Oct 25).','SEO title <b>Newsletters</b>; description: <i>Read the Veterans Healing Farm monthly newsletter: workshops, harvests, events, and farm news, with every issue back to 2022.</i>'],post:['The Latest issue card and a few old issues open in Constant Contact.','The sign-up form below the Code block subscribes a test address.']},
  {id:'i990',name:'990 Forms',copy:'/i990-forms-1',slug:'i990-forms',files:['content/i990-full.html'],pre:['Copy page already created, pasted and hidden (Oct 25).','SEO title <b>990 Forms</b>; description: <i>Veterans Healing Farm\'s IRS Form 990 filings, 2021 to 2024, plus our NC solicitation license. EIN 46-5689396.</i>'],post:['All four 990 PDFs and the solicitation license download. (This also fixes D3: the old page was NOINDEX.)']},
  {id:'sponsors',name:'Sponsors',copy:'/sponsors-1',slug:'sponsors',files:['content/sponsors-full.html'],pre:['Already done Oct 25: galleries removed, the Code block is the only block, light theme.','SEO title <b>Our Sponsors</b> (fixes "Gallery 1", D7); description: <i>The foundations, businesses, clubs, and families who make Veterans Healing Farm\'s programs for veterans possible.</i>'],post:['All logos load.','Custom CSS: delete the <b>SPONSORS (COPY)</b> rules (they styled the old galleries). Ask Claude to remove them from <code>site/custom.less</code> too.']},
  {id:'news',name:'In the News',copy:'/news-copy',slug:'news',files:['content/news-full.html'],pre:['Copy page already created, pasted and hidden (Oct 25).','SEO title <b>In the News</b>; description: <i>Veterans Healing Farm in the news: TV, radio, and print coverage of our work with veterans in Western North Carolina, plus our 2023 Nonprofit of the Year award.</i>'],post:['A few stories open on the outlets\' sites; year buttons jump and open older years.']},
  {id:'donate',name:'Donate + Privacy Policy',copy:'/donate-1',slug:'donate',files:['content/donate-full.html','content/privacy-policy.html'],pre:['Paste <code>donate-full.html</code> into the Donate copy.'],post:['Test a Donate button end to end (PayPal page opens, one-time and monthly options show).','<b>Same day:</b> paste <code>privacy-policy.html</code> into the live <code>/privacy-policy</code> Code block (it now names PayPal, not the Community Foundation). Check "Last updated: October 25, 2026".']}
 ]},
 {t:'Phase 2: forms',intro:'Check the forms and the squad links carefully.',pages:[
  {id:'contact',name:'Contact',copy:'/contact-1',slug:'contact',files:['content/contact-full.html'],pre:['Send a test email to <b>operations@veteranshealingfarm.org</b> and confirm it arrives. If it doesn\'t, ask Claude to switch the page back to veteranshealingfarm@gmail.com and re-copy.'],post:['Phone, email, map and social links all work.']},
  {id:'volunteer',name:'Volunteer',copy:'/volunteer-1',slug:'volunteer',files:['content/volunteer-full.html'],pre:[],post:['The volunteer form works (send a test).','<a href="'+SITE+'/volunteer#bee-squad" target="_blank" rel="noopener">/volunteer#bee-squad</a>, <code>#herb-squad</code> and <code>#garden-squad</code> land on their cards; the Garden Group card\'s link opens <code>/garden</code>.']}
 ]},
 {t:'Phase 3: people',intro:'',pages:[
  {id:'board',name:'Board',copy:'/board-1',slug:'board',files:['content/board-full.html'],pre:[],post:['Titles: Juba President, Simone Treasurer, Lauterbach Director. (After the November board meeting: Lauterbach to Secretary, Jeanine Davis\'s card off, then re-paste.)']},
  {id:'staff',name:'Staff',copy:'/staff-new-1',slug:'staff-new',files:['content/staff-full.html'],pre:['Already done Oct 25: the copy is one Code block with this file.'],post:['Page title is no longer "Team 1" (D6). The 2024 Form 990 link downloads.']}
 ]},
 {t:'Phase 4: the big search pages',intro:'',pages:[
  {id:'about',name:'Our Mission & Farm',copy:'/about-1',slug:'about',files:['content/about-full.html'],pre:[],post:['The 2025 Year-End Report download works; numbers match Programs and Home.']},
  {id:'programs',name:'Programs',copy:'/programs-copy',slug:'programs',files:['content/programs-a.html','content/programs-b.html'],pre:['<b>Two Code blocks:</b> part A in the first, part B in the second, A above B.'],post:['Clay &amp; Camaraderie shows the short teaser (photo, one paragraph, two links).']}
 ]},
 {t:'Phase 5: Events (before the Nov 11 launch)',intro:'',pages:[
  {id:'events',name:'Event Calendar',copy:'/events-1',slug:'events',files:['content/events-full.html'],pre:['After pasting, replace the calendar key placeholder with the <b>real key</b> in Squarespace only (never in the local file).','Enable the page (it\'s Disabled today).'],post:['The calendar loads and the 5K shows.','The farm TV banner shows; squad meetings show <b>More info</b>.']}
 ]},
 {t:'Phase 6: Home, last',intro:'Every page Home links to should be live first.',pages:[
  {id:'home',name:'Home',copy:'/home-1',slug:'',home:true,files:['content/home-full.html'],pre:['Paste into the Code block <b>above</b> the native newsletter section (leave that section native so sign-ups keep working).'],post:[]}
 ]},
 {t:'After the swaps',intro:'Do once everything is live, and again the day before the Nov 11 launch.',pages:[
  {id:'final',name:'Final checks',files:[],steps:[
   'No NOINDEX on any of the 15 live pages (view source, search <code>robots</code>).',
   'Each live page shows its new SEO title and description.',
   'Menus, header and footer go to the new pages; none go to <code>-1</code>, <code>-copy</code> or <code>-old</code> addresses.',
   'Forms work: newsletter sign-up, Volunteer, Contact, Donate.',
   'Phone view of Home, Programs, Donate and Events.',
   'Marketing → SEO → Homepage title and description match <code>content/seo-metadata.md</code>.',
   'Google Search Console (if set up): request indexing for /, /about, /programs, /events, /donate.',
   'Tell Claude the swap is done, so the hub and notes point at the live paths.',
   'Remove the preview-mode script: Settings → Advanced → Code Injection → Header, delete the block that starts with <code>&lt;!-- VHF preview mode</code>. Save.'
  ]}
 ]}
];

function homeSteps(){return [
 'Verify the copy (logged in): text, photos, buttons, links, and phone view.',
 'Make <code>/home-1</code> the homepage (Pages → hover it → gear → <b>Set as Homepage</b>). No slug rename.',
 'On the new homepage: Hide from search results <b>OFF</b>.',
 'Marketing → SEO → <b>Homepage</b>: title and description match <code>content/seo-metadata.md</code>.',
 'View source of <a href="'+SITE+'/" target="_blank" rel="noopener">the homepage</a>: no NOINDEX. The old homepage: Hide ON, Not Linked.'
];}
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{v?localStorage.setItem(k,'1'):localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var root=document.getElementById('phases'),all=[],num=0;
PHASES.forEach(function(ph){
  var h=document.createElement('h2');h.textContent=ph.t;root.appendChild(h);
  if(ph.intro){var p=document.createElement('p');p.className='phase-intro';p.textContent=ph.intro;root.appendChild(p)}
  ph.pages.forEach(function(pg){
    var steps=[];
    if(pg.steps){steps=pg.steps}
    else{
      steps.push(['h','Before']);
      (pg.isNew?newCopy(pg.name,pg.copy):[]).forEach(function(s){steps.push(s)});
      pg.pre.forEach(function(s){if(s!=='__new__')steps.push(s)});
      steps.push((pg.files.length>1&&pg.id==='programs')?'Copy part A into Code block 1 and part B into Code block 2 on the copy.':'Copy the code (button above) and paste it into the copy\'s Code block. Save.');
      steps.push(['h','Swap']);
      (pg.home?homeSteps():swapSteps(pg.slug,pg.copy)).forEach(function(s){steps.push(s)});
      if(pg.post.length){steps.push(['h','Check']);pg.post.forEach(function(s){steps.push(s)})}
    }
    var d=document.createElement('details');d.className='page';d.id='p-'+pg.id;
    var isPage=!!pg.copy;if(isPage)num++;
    var sum='<summary><span class="n">'+(isPage?num:'')+'</span><b>'+esc(pg.name)+'</b>'+(pg.hold?' <span class="tag tag--hold">Hold</span>':'')+(pg.isNew?' <span class="tag">New copy page</span>':'')+(isPage?'<span class="path">'+esc(pg.copy)+' → /'+esc(pg.slug)+'</span>':'')+'<span class="count"></span></summary>';
    var body='<div class="body">';
    if(pg.files.length){body+='<div class="files">';pg.files.forEach(function(f){body+='<button class="btn btn--copy" type="button" data-file="'+esc(f)+'">Copy code: '+esc(f.split('/').pop())+'</button><a href="'+esc(f)+'" target="_blank">open</a>'});body+='</div>'}
    if(isPage){body+='<div class="links"><a href="'+ADMIN+esc(pg.copy)+'" target="_blank" rel="noopener">Copy page (logged in)</a><a href="'+SITE+'/'+esc(pg.slug)+'" target="_blank" rel="noopener">Live page</a></div>'}
    body+='<ul class="steps">';
    var k=0;
    steps.forEach(function(s){
      if(Array.isArray(s)){body+='<li><h4>'+esc(s[1])+'</h4></li>';return}
      var key='vhfSwap:'+pg.id+':'+(k++);all.push(key);
      var warn=/^<span>Hold/.test(s);
      body+='<li'+(warn?' class="warn"':'')+'><label><input type="checkbox" data-key="'+key+'"'+(store.get(key)?' checked':'')+'><span>'+s.replace(/^<span>|<\/span>$/g,'')+'</span></label></li>';
    });
    body+='</ul></div>';
    d.innerHTML=sum+body;root.appendChild(d);
  });
});
function refresh(){
  var done=0;
  document.querySelectorAll('details.page').forEach(function(d){
    var b=d.querySelectorAll('input[type=checkbox]'),c=d.querySelectorAll('input:checked').length;done+=c;
    d.querySelector('.count').textContent=c+' of '+b.length;
    d.classList.toggle('complete',b.length>0&&c===b.length);
  });
  document.getElementById('prog').style.width=(all.length?100*done/all.length:0)+'%';
  document.getElementById('progTxt').textContent=done+' of '+all.length+' steps';
}
root.addEventListener('change',function(e){var k=e.target.getAttribute('data-key');if(k){store.set(k,e.target.checked);refresh()}});
root.addEventListener('click',function(e){
  var b=e.target.closest('.btn--copy');if(!b)return;
  var f=b.getAttribute('data-file'),label=b.textContent;
  fetch(f).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return navigator.clipboard.writeText(t)}).then(function(){
    b.classList.add('ok');b.textContent='Copied '+f.split('/').pop();setTimeout(function(){b.classList.remove('ok');b.textContent=label},2500);
  }).catch(function(){b.textContent='Copy failed: use "open", then Ctrl+A, Ctrl+C';});
});
document.getElementById('reset').addEventListener('click',function(){if(!confirm('Clear all ticks?'))return;all.forEach(function(k){store.set(k,false)});document.querySelectorAll('.steps input').forEach(function(i){i.checked=false});refresh()});
var openAll=document.getElementById('openAll');
openAll.addEventListener('click',function(){var ds=document.querySelectorAll('details.page'),o=openAll.textContent==='Expand all';ds.forEach(function(d){d.open=o});openAll.textContent=o?'Collapse all':'Expand all'});
document.getElementById('p-settings').open=true;
refresh();
</script>
</body>
</html>
